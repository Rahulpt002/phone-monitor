# Render Blueprint: one free web service that runs the Server and serves the built Dashboard.
#
# Create it in the Render dashboard: New > Blueprint > pick this repository. Render reads this
# file from the repository root by default. Step-by-step guide: docs/deploy.md section 1.
#
# Render's free tier has no persistent disk, so the database is Turso (libSQL):
# DATABASE_URL=libsql://<db>-<org>.turso.io plus DATABASE_AUTH_TOKEN.
services:
  - type: web
    name: hotspot-monitor
    runtime: node
    plan: free
    # Pick the region closest to the phone and to your Turso database; it cannot be changed later.
    region: singapore
    branch: main
    autoDeploy: true
    # Runs from the repository root: installs every workspace, builds web/dist then server/dist.
    # Do not set NODE_ENV=production here: npm ci would skip the dev dependencies the build needs.
    buildCommand: npm ci && npm run build
    # node server/dist/index.js (root package.json); serves web/dist and listens on Render's PORT.
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      # Latest Node 22 LTS. Vite 8 needs ^20.19 or >=22.12 (root package.json "engines", .nvmrc).
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: SESSION_TTL_DAYS
        value: "30"
      # Render's proxy is one hop: the client IP is the right-most X-Forwarded-For entry, which a
      # client cannot forge (login rate limits are per IP). See docs/deploy.md section 6.1.
      - key: TRUST_PROXY
        value: "1"
      # Required secrets (Render asks for them when the Blueprint is created).
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Optional. Leave empty to skip. PUBLIC_URL defaults to Render's RENDER_EXTERNAL_URL;
      # set it only for a custom domain. Empty VAPID keys are generated once and kept in the DB.
      - key: PUBLIC_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: CORS_ORIGINS
        sync: false
